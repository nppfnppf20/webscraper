services:
  # Cron job to run all scrapers daily
  - type: cron
    name: daily-scraper
    env: python
    buildCommand: pip install -r requirements.txt
    schedule: "0 2 * * *"  # Run at 2 AM GMT/UTC daily
    command: python run_all_scrapers.py
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: POSTGRES_SCHEMA
        value: scraper
